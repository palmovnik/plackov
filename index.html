            // handle password form submission
            document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
                e.preventDefault();

                const password = document.getElementById("staticrypt-password").value.trim().toLowerCase(),
                    isRememberChecked = document.getElementById("staticrypt-remember").checked;

                const web = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);
                let isSuccessful = web.isSuccessful;
                if (isSuccessful) udalost("heslo-spravne", "Heslo: správné");
                else if (sklep && (isSuccessful = (await sklep.handleDecryptionOfPageFromHash(web.hashedPassword, isRememberChecked)).isSuccessful))
                    udalost("heslo-sklep", "Heslo: sklep");
                else udalost("heslo-spatne", "Heslo: špatné");

                if (!isSuccessful) {
                    document.getElementById("chyba").textContent = templateError;
                }
            });
        </script>
    </body>
</html>

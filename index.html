            .staticrypt-title { margin: 0; font: 400 clamp(19px, 5vw, 26px)/1 var(--display); letter-spacing: .2em; text-transform: uppercase; padding-left: .2em; }
            .staticrypt-instructions p:not(.staticrypt-title) { margin: 14px 0 0; color: var(--tlumene); font-size: 15px; text-wrap: balance; }
            .linka { width: 46px; height: 1px; background: var(--linka); margin: 4px 0; }
            #staticrypt-form { width: 100%; display: grid; gap: 18px; justify-items: center; }
            .staticrypt-password-container { position: relative; width: 100%; }
            #staticrypt-password { width: 100%; border: 0; border-bottom: 1px solid var(--linka); background: transparent; color: inherit;
                    font: 300 17px/1 var(--text); letter-spacing: .06em; text-align: center; padding: 12px 34px; outline: 0; border-radius: 0; }
            #staticrypt-password:focus { border-bottom-color: var(--inkoust); }
            #staticrypt-password::placeholder { color: var(--tlumene); letter-spacing: .02em; }
            .staticrypt-toggle-password-visibility { position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
                    width: 18px; height: 18px; opacity: .35; cursor: pointer; }
            label.staticrypt-remember { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--tlumene); cursor: pointer; }
            .staticrypt-remember input { accent-color: var(--inkoust); width: 14px; height: 14px; margin: 0; }
            .staticrypt-decrypt-button { appearance: none; border: 1px solid var(--linka); background: transparent; color: var(--inkoust);
                    font: 400 12px/1 var(--display); letter-spacing: .2em; text-transform: uppercase; padding: 13px 26px 13px 28px; cursor: pointer;
                    transition: border-color .2s, background .2s; }
            .staticrypt-decrypt-button:hover, .staticrypt-decrypt-button:focus-visible { border-color: var(--inkoust); background: rgba(47, 54, 50, .04); outline: 0; }
            .chyba { margin: 0; min-height: 1.4em; font-size: 14px; color: #6b2a2a; }
            .staticrypt-spinner-container { min-height: 100vh; display: grid; place-items: center; }
            .staticrypt-spinner { width: 22px; height: 22px; border: 1px solid var(--linka); border-top-color: var(--inkoust); border-radius: 50%;
                    animation: spinner-border .9s linear infinite; }
            @keyframes spinner-border { 100% { transform: rotate(360deg); } }
            /* ruce z etikety 60:40 Sekt 2025, předloktí dokreslená (skripty/heslo_ruce_prodlouzit.py);
               obrázek začíná u horního okraje stránky, ruce sahají „zvenku“; dole a po stranách rozpuštěný do papíru */
            .ruka { display: block; width: min(520px, 100vw); height: auto; margin: 0 0 -6vh;
                    -webkit-mask-image: linear-gradient(to bottom, #000 80%, transparent), linear-gradient(to right, transparent, #000 10%, #000 90%, transparent);
                    -webkit-mask-composite: source-in;
                    mask-image: linear-gradient(to bottom, #000 80%, transparent), linear-gradient(to right, transparent, #000 10%, #000 90%, transparent);
                    mask-composite: intersect; }
            .staticrypt-content { place-items: start center; padding-top: 0; overflow-x: hidden; }
            /* kresba je širší než sloupec formuláře – sloupec se nesmí roztáhnout, jinak pole uteče ze středu;
               šťávy se potkávají zhruba v polovině kresby, tedy nad polem */
            .staticrypt-form { grid-template-columns: minmax(0, 1fr); }
            .staticrypt-form { padding-bottom: 48px; }
            /* pole na střed pod rukama, šipka stojí vedle mimo rozložení */
            #staticrypt-form { position: relative; grid-template-columns: 1fr; gap: 10px; width: min(260px, 70vw); }
            .staticrypt-decrypt-button { position: absolute; left: calc(100% + 6px); top: 4px; }
            .chyba { grid-column: 1 / -1; text-align: center; }
            .staticrypt-toggle-password-visibility { display: none; }
            #staticrypt-password { padding: 10px 6px; }
            .staticrypt-decrypt-button { padding: 8px 4px; border: 0; font: 300 20px/1 var(--text); letter-spacing: 0; opacity: .55; }
            .staticrypt-decrypt-button:hover, .staticrypt-decrypt-button:focus-visible { opacity: 1; background: transparent; }
            .mapa { display: block; width: min(460px, 86vw); height: auto; margin: 9vh 0 6px; border-radius: 3px; box-shadow: 0 1px 2px rgba(40,40,30,.1), 0 18px 40px -20px rgba(40,40,30,.5) }
            .podtitul { margin: -8px 0 6px; color: var(--tlumene); font-size: 14px }
        </style>
    </head>
